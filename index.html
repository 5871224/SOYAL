<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>SOYAL MSG Viewer</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="wrap">
    <header>
      <h1>SOYAL MSG Viewer</h1>
      <div class="header-actions">
        <button id="doorSettingsBtn">門號設定</button>
        <button id="userSettingsBtn">使用者設定</button>
      </div>
    </header>

    <section class="card uploader" id="dropZone">
      <input id="fileInput" type="file" accept=".msg,application/octet-stream" multiple hidden />
      <button id="pickBtn" class="primary">選擇 .msg 檔</button>
      <strong>或一次拖曳多個檔案到這裡</strong>
      <span>可同時解析多個 SOYAL .msg；完全相同的 100-byte 紀錄會自動去除重複</span>
    </section>

    <section class="card toolbar" id="toolbar" hidden>
      <div class="stats">
        <button id="clearBtn" type="button">清空資料</button>
        <span id="fileStat"></span>
        <span id="recordStat"></span>
        <span id="duplicateStat"></span>
        <span id="errorStat"></span>
      </div>
      <div class="toolbar-controls">
        <div class="filters">
          <input id="searchBox" type="search" placeholder="搜尋時間、門號、門名稱、使用者名稱、事件碼…" />
          <select id="doorFilter"><option value="">全部門號</option></select>
          <select id="addressFilter"><option value="">全部使用者</option></select>
          <select id="codeFilter"><option value="">全部事件</option></select>
        </div>
        <button id="exportBtn" class="export-button">匯出 Excel</button>
      </div>
    </section>

    <section class="card table-card" id="resultSection" hidden>
      <div class="table-wrap" id="tableWrap">
        <table>
          <thead>
            <tr>
              <th class="sortable" data-sort="loadOrder"># <span class="sort-mark"></span></th>
              <th class="sortable" data-sort="eventTime">事件時間 <span class="sort-mark"></span></th>
              <th class="sortable" data-sort="door">門號 <span class="sort-mark"></span></th>
              <th class="sortable" data-sort="doorName">門名稱 <span class="sort-mark"></span></th>
              <th class="sortable" data-sort="userAddress">使用者代碼 <span class="sort-mark"></span></th>
              <th class="sortable" data-sort="userName">使用者名稱 <span class="sort-mark"></span></th>
              <th class="sortable" data-sort="functionCode">事件碼 <span class="sort-mark"></span></th>
              <th class="sortable" data-sort="functionName">事件名稱 <span class="sort-mark"></span></th>
              <th class="sortable" data-sort="fileName">檔案 <span class="sort-mark"></span></th>
              <th>詳細</th>
            </tr>
          </thead>
          <tbody id="resultBody"></tbody>
        </table>
      </div>
      <div class="pagination" id="pagination">
        <div class="pagination-info" id="paginationInfo"></div>
        <div class="pagination-buttons">
          <button id="firstPageBtn" type="button">首頁</button>
          <button id="prevPageBtn" type="button">上一頁</button>
          <span id="pageStat"></span>
          <button id="nextPageBtn" type="button">下一頁</button>
          <button id="lastPageBtn" type="button">末頁</button>
        </div>
      </div>
    </section>
  </main>

  <dialog id="detailDialog">
    <div class="dialog-head"><h2>Record 詳細資料</h2><button id="closeDialog" aria-label="關閉">×</button></div>
    <div id="detailSummary" class="detail-summary"></div>
    <div class="hex-grid" id="hexGrid"></div>
  </dialog>

  <dialog id="doorSettingsDialog" class="settings-dialog">
    <div class="dialog-head"><h2>門號設定</h2><button class="dialog-close" data-close="doorSettingsDialog" aria-label="關閉">×</button></div>
    <form id="doorForm" class="settings-form">
      <input id="doorEditId" type="hidden" />
      <label>門號<input id="doorNo" type="number" min="0" required /></label>
      <label class="grow">門名稱<input id="doorName" type="text" maxlength="200" placeholder="例如：大門-3F" required /></label>
      <div class="form-actions">
        <button class="primary" type="submit">儲存</button>
        <button id="doorCancelEdit" type="button" hidden>取消編輯</button>
      </div>
    </form>
    <div class="settings-excel-actions">
      <input id="doorExcelInput" type="file" accept=".xlsx,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet" hidden />
      <div class="settings-excel-buttons">
        <button id="doorExportExcel" type="button">匯出 Excel</button>
        <button id="doorImportExcel" type="button">匯入 Excel</button>
      </div>
      <span class="note">匯出的 .xlsx 可直接修改後再匯入；格式為「門號、門名稱」。匯入只新增／更新，不會刪除未列出的既有資料。</span>
    </div>
    <div class="settings-message" id="doorMessage"></div>
    <div class="settings-table-wrap">
      <table class="settings-table">
        <thead><tr><th>門號</th><th>門名稱</th><th>操作</th></tr></thead>
        <tbody id="doorSettingsBody"></tbody>
      </table>
    </div>
  </dialog>

  <dialog id="userSettingsDialog" class="settings-dialog">
    <div class="dialog-head"><h2>使用者設定</h2><button class="dialog-close" data-close="userSettingsDialog" aria-label="關閉">×</button></div>
    <form id="userForm" class="settings-form">
      <input id="userEditId" type="hidden" />
      <label>使用者代碼<input id="userAddressInput" type="number" min="0" required /></label>
      <label class="grow">使用者名稱<input id="userName" type="text" maxlength="200" placeholder="例如：張均穗" required /></label>
      <div class="form-actions">
        <button class="primary" type="submit">儲存</button>
        <button id="userCancelEdit" type="button" hidden>取消編輯</button>
      </div>
    </form>
    <div class="settings-excel-actions">
      <input id="userExcelInput" type="file" accept=".xlsx,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet" hidden />
      <div class="settings-excel-buttons">
        <button id="userExportExcel" type="button">匯出 Excel</button>
        <button id="userImportExcel" type="button">匯入 Excel</button>
      </div>
      <span class="note">匯出的 .xlsx 可直接修改後再匯入；匯入只新增／更新，不會刪除未列出的既有資料。</span>
    </div>
    <div class="settings-message" id="userMessage"></div>
    <div class="settings-table-wrap">
      <table class="settings-table">
        <thead><tr><th>使用者代碼</th><th>使用者名稱</th><th>操作</th></tr></thead>
        <tbody id="userSettingsBody"></tbody>
      </table>
    </div>
  </dialog>

  <script type="module" src="app.js"></script>
  <script type="module" src="settings-excel-ui.js"></script>
</body>
</html>
